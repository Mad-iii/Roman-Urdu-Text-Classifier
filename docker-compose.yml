services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      MODEL_DIR: /models/best
    volumes:
      - ./models/encoder:/models/best:ro   # point at whichever model won
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s